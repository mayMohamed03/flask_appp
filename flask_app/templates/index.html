<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>نظام التصنيفات</title>
    <style>
        body { font-family: Arial; direction: rtl; text-align: right; }
        table, th, td { border: 1px solid #ccc; border-collapse: collapse; padding: 8px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>نظام التصنيفات</h1>
    <form action="/add" method="POST">
        <input name="category" placeholder="التصنيف" required>
        <input name="section" placeholder="القسم" required>
        <input name="content" placeholder="المضمون" required>
        <input name="notes" placeholder="ملاحظات">
        <input name="price" placeholder="السعر" type="number" step="0.01" required>
        <button type="submit">إضافة</button>
    </form>
    <hr>
    {% for category, entries in categories.items() %}
        <h2>{{ category }} - المجموع: {{ totals[category] }}</h2>
        <table>
            <tr><th>القسم</th><th>المضمون</th><th>ملاحظات</th><th>السعر</th></tr>
            {% for entry in entries %}
            <tr>
                <td>{{ entry[2] }}</td>
                <td>{{ entry[3] }}</td>
                <td>{{ entry[4] }}</td>
                <td>{{ entry[5] }}</td>
            </tr>
            {% endfor %}
        </table>
    {% endfor %}
    <h3>المجموع الكلي: {{ grand_total }}</h3>
</body>
</html>
